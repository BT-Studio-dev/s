<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="prevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#1c140a" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="70%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#e0841b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#e0841b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sapphireGlow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb55a" />
      <stop offset="100%" stop-color="#e0841b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="180" rx="16" fill="url(#prevBg)" />
  <rect width="320" height="180" rx="16" fill="url(#goldGlow)" />
  <rect width="320" height="180" rx="16" fill="url(#sapphireGlow)" />
  <rect width="320" height="180" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Glass Card Sample -->
  <rect x="24" y="22" width="272" height="136" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(224,132,27,0.3)" stroke-width="1.2" />

  <!-- Top bar in preview -->
  <circle cx="44" cy="40" r="4" fill="#ef4444" />
  <circle cx="56" cy="40" r="4" fill="#f59e0b" />
  <circle cx="68" cy="40" r="4" fill="#10b981" />
  <text x="86" y="44" font-family="'Cinzel', serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1">LIQUIDX</text>
  <rect x="236" y="32" width="48" height="16" rx="8" fill="rgba(224,132,27,0.2)" stroke="rgba(224,132,27,0.4)" stroke-width="1" />
  <text x="246" y="43" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffb55a">ONLINE</text>

  <!-- Content elements -->
  <rect x="40" y="62" width="140" height="8" rx="4" fill="rgba(255,255,255,0.2)" />
  <rect x="40" y="78" width="100" height="6" rx="3" fill="rgba(255,255,255,0.1)" />

  <!-- Liquid Stat Bar -->
  <rect x="40" y="98" width="240" height="6" rx="3" fill="rgba(255,255,255,0.08)" />
  <rect x="40" y="98" width="168" height="6" rx="3" fill="url(#goldText)" />

  <!-- Liquid button in preview -->
  <rect x="40" y="118" width="84" height="24" rx="12" fill="url(#goldText)" />
  <text x="56" y="133" font-family="sans-serif" font-size="9" font-weight="700" fill="#0b0d10">Launch</text>

  <rect x="132" y="118" width="76" height="24" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <text x="148" y="133" font-family="sans-serif" font-size="9" font-weight="600" fill="#ffffff">Console</text>
</svg>

