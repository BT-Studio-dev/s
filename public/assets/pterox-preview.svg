<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="pteroxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10" />
      <stop offset="60%" stop-color="#111525" />
      <stop offset="100%" stop-color="#171d27" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#23aeea" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#23aeea" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orangeGlow" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#ff5108" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff5108" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b2b" />
      <stop offset="100%" stop-color="#ff5108" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="180" rx="16" fill="url(#pteroxBg)" />
  <rect width="320" height="180" rx="16" fill="url(#cyanGlow)" />
  <rect width="320" height="180" rx="16" fill="url(#orangeGlow)" />
  <rect width="320" height="180" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Top PteroX Header Simulation -->
  <rect x="18" y="16" width="284" height="26" rx="6" fill="#171d27" stroke="#252d38" stroke-width="1" />
  <!-- Hamburger -->
  <rect x="26" y="24" width="12" height="2" rx="1" fill="#d7dde5" />
  <rect x="26" y="28" width="12" height="2" rx="1" fill="#d7dde5" />
  <rect x="26" y="32" width="12" height="2" rx="1" fill="#d7dde5" />

  <!-- PteroX Brand Text -->
  <text x="46" y="34" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#f5f7fa" letter-spacing="-0.5">ptero<tspan fill="#23aeea" font-weight="800">X</tspan></text>

  <!-- Header Rocket Button -->
  <rect x="272" y="20" width="22" height="18" rx="4" fill="url(#rocketGrad)" />
  <path d="M283 23 L286 28 L284 28 L285 33 L280 27 L282 27 Z" fill="#ffffff" />

  <!-- Server Card Preview with Banner -->
  <rect x="18" y="52" width="136" height="114" rx="8" fill="#171d27" stroke="#252d38" stroke-width="1" />
  <rect x="18" y="52" width="136" height="42" rx="8" fill="#1e2633" />
  <path d="M18 78 Q 60 65, 90 75 T 154 70 L 154 94 L 18 94 Z" fill="#252f40" opacity="0.8" />
  <text x="26" y="78" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#ffffff">Survival MC</text>
  
  <circle cx="28" cy="106" r="3" fill="#10b981" />
  <text x="36" y="109" font-family="'Poppins', sans-serif" font-size="8" font-weight="600" fill="#cbd5e1">Online</text>
  <text x="110" y="109" font-family="'Poppins', sans-serif" font-size="8" fill="#23aeea">1.2G/4G</text>

  <rect x="24" y="120" width="124" height="4" rx="2" fill="rgba(255,255,255,0.08)" />
  <rect x="24" y="120" width="62" height="4" rx="2" fill="#23aeea" />

  <!-- Action buttons -->
  <rect x="24" y="134" width="22" height="20" rx="4" fill="#252d38" />
  <rect x="52" y="134" width="22" height="20" rx="4" fill="#252d38" />
  <rect x="80" y="134" width="22" height="20" rx="4" fill="#252d38" />
  <rect x="108" y="134" width="22" height="20" rx="4" fill="#252d38" />

  <!-- Second Card / Tutorials Preview -->
  <rect x="166" y="52" width="136" height="114" rx="8" fill="#171d27" stroke="#252d38" stroke-width="1" />
  <rect x="176" y="64" width="80" height="8" rx="4" fill="#23aeea" opacity="0.8" />
  <rect x="176" y="78" width="116" height="5" rx="2.5" fill="rgba(255,255,255,0.15)" />
  <rect x="176" y="88" width="96" height="5" rx="2.5" fill="rgba(255,255,255,0.1)" />
  <rect x="176" y="98" width="108" height="5" rx="2.5" fill="rgba(255,255,255,0.1)" />

  <rect x="176" y="118" width="116" height="36" rx="6" fill="#111525" stroke="#252d38" stroke-width="0.8" />
  <text x="184" y="132" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#ffffff">Billing &amp; Tiers</text>
  <text x="184" y="145" font-family="'Poppins', sans-serif" font-size="7" fill="#ff5108">$5.00/mo Active</text>
</svg>

