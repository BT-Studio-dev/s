<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="liquidxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="30%" stop-color="#ffb55a" />
      <stop offset="70%" stop-color="#e0841b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="liquidMesh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0d10" />
      <stop offset="50%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#1f1810" />
    </linearGradient>
    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="liquidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Obsidian Hex-Rect -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#liquidMesh)" stroke="url(#liquidxGrad)" stroke-width="3.5" filter="url(#liquidGlow)"/>

  <!-- Liquid Droplet / Glass Prism Structure -->
  <path d="M 100 42 C 115 65 148 108 148 128 C 148 154 126 168 100 168 C 74 168 52 154 52 128 C 52 108 85 65 100 42 Z" fill="url(#glassFacet)" stroke="url(#liquidxGrad)" stroke-width="2.5" />

  <!-- Liquid 'X' & 'L' intersecting streamlines -->
  <!-- L Stem -->
  <path d="M 80 94 L 80 138 L 108 138" fill="none" stroke="url(#liquidxGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- X Cross -->
  <path d="M 106 98 L 132 138" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  <path d="M 132 98 L 106 138" fill="none" stroke="url(#liquidxGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Amber Molten Core Lights -->
  <circle cx="100" cy="48" r="4.5" fill="#ffedd5" filter="url(#liquidGlow)" />
  <circle cx="70" cy="130" r="3.5" fill="#ffb55a" />
  <circle cx="130" cy="130" r="3.5" fill="#e0841b" />
</svg>

