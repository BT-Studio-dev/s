<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mpanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7f00ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="#0f172a" stroke="url(#mpanelGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- M Shape -->
  <path d="M 55 140 L 55 60 L 100 105 L 145 60 L 145 140" fill="none" stroke="url(#mpanelGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Server Node Dots -->
  <circle cx="55" cy="60" r="5" fill="#00f2fe" />
  <circle cx="100" cy="105" r="6" fill="#ffffff" />
  <circle cx="145" cy="60" r="5" fill="#7f00ff" />
</svg>

